name: Telegram Keys Harvester
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scrape fresh keys from Telegram channels
        run: python3 scanner.py
      - name: Publish Happ subscription
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/ nodes.json
          git diff --staged --quiet || (git commit -m "Update fresh Telegram VPN keys" && git push)
