name: WARP AmneziaWG Generator
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate WARP AmneziaWG config
        run: |
          pip install -q cryptography
          python3 scanner.py
      - name: Publish config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub/ warp.conf
          git diff --staged --quiet || (git commit -m "Update WARP AmneziaWG config" && git push)
