name: Check VLESS Nodes Every 10 Min

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-nodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Xray-core
        run: |
          curl -L -o xray.zip https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip xray
          chmod +x xray

      - name: Probe VLESS nodes in parallel with Xray-core
        run: |
          python3 - << 'EOF'
          import base64, concurrent.futures, json, os, subprocess, threading, time, urllib.request, urllib.parse

          TARGET_COUNT = 24
          SOURCES = [
            "https://cdn.jsdelivr.net/gh/0xRadikal/Free-v2ray-Configs@main/top100.txt",
            "https://cdn.jsdelivr.net/gh/hamedcode/port-based-v2ray-configs@main/sub/vless.txt",
            "https://raw.githubusercontent.com/MatinGhanbari/v2ray-configs/main/subscriptions/filtered/subs/vless.txt",
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/Splitted-By-Protocol/vless.txt",
            "https://raw.githubusercontent.com/barry-far/V2ray-config/main/Splitted-By-Protocol/vless.txt"
          ]

          port_lock = threading.Lock()
          next_port = [21000]

          def alloc_port():
            with port_lock:
              p = next_port[0]
              next_port[0] += 1
              return p

          def test_vless_with_xray(uri):
            port = alloc_port()
            cfg_file = f"cfg_{port}.json"
            proc = None
            try:
              u = urllib.parse.urlparse(uri)
              qs = urllib.parse.parse_qs(u.query)
              sec = qs.get("security", [""])[0].lower()
              net = qs.get("type", ["tcp"])[0].lower()
              sni = qs.get("sni", [""])[0]
              if not u.hostname or not u.username or net not in ("tcp", "grpc", "ws", "xhttp"):
                return None

              stream = {"network": net, "security": sec}
              if sec == "reality":
                pbk = qs.get("pbk", [""])[0]
                if len(pbk) < 40 or not sni:
                  return None
                stream["realitySettings"] = {
                  "serverName": sni,
                  "fingerprint": qs.get("fp", ["firefox"])[0],
                  "publicKey": pbk,
                  "shortId": qs.get("sid", [""])[0]
                }
              elif sec == "tls":
                stream["tlsSettings"] = {
                  "serverName": sni or u.hostname,
                  "allowInsecure": True
                }
              else:
                return None

              if net == "ws":
                stream["wsSettings"] = {"path": qs.get("path", ["/"])[0], "headers": {"Host": qs.get("host", [sni or u.hostname])[0]}}
              elif net == "grpc":
                stream["grpcSettings"] = {"serviceName": qs.get("serviceName", [""])[0]}

              cfg = {
                "log": {"loglevel": "none"},
                "inbounds": [{"port": port, "listen": "127.0.0.1", "protocol": "socks"}],
                "outbounds": [{
                  "protocol": "vless",
                  "settings": {"vnext": [{"address": u.hostname, "port": u.port or 443, "users": [{"id": u.username, "encryption": "none", "flow": qs.get("flow", [""])[0]}]}]},
                  "streamSettings": stream
                }]
              }
              with open(cfg_file, "w") as f:
                json.dump(cfg, f)
              proc = subprocess.Popen(["./xray", "-c", cfg_file], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              time.sleep(0.8)

              r204 = subprocess.run(
                ["curl", "-sS", "-o", "/dev/null", "-w", "%{http_code}", "--max-time", "4", "--socks5-hostname", f"127.0.0.1:{port}", "https://cp.cloudflare.com/generate_204"],
                capture_output=True, text=True
              )
              if r204.returncode != 0 or r204.stdout.strip() not in ("204", "200"):
                return None

              r_geo = subprocess.run(
                ["curl", "-sS", "--max-time", "4", "--socks5-hostname", f"127.0.0.1:{port}", "https://api.country.is"],
                capture_output=True, text=True
              )
              if r_geo.returncode == 0 and '"country"' in r_geo.stdout:
                cc = json.loads(r_geo.stdout).get("country", "").upper()
                if cc and cc not in ("RU", "BY", "CN", "IR"):
                  return (uri, cc)
            except Exception:
              pass
            finally:
              if proc:
                proc.terminate()
              if os.path.exists(cfg_file):
                os.remove(cfg_file)
            return None

          working = []
          seen = set()
          country_counts = {}

          existing = []
          if os.path.exists("verified_vless.txt"):
            for line in open("verified_vless.txt", encoding="utf-8"):
              uri = line.strip().split("#")[0]
              if uri.startswith("vless://") and uri not in seen:
                seen.add(uri)
                existing.append(uri)

          if existing:
            with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
              for res in ex.map(test_vless_with_xray, existing):
                if res and len(working) < TARGET_COUNT:
                  uri, cc = res
                  if country_counts.get(cc, 0) < 2:
                    country_counts[cc] = country_counts.get(cc, 0) + 1
                    working.append(f"{uri}#{cc}")
                    print("KEEP:", cc, uri.split("@")[1].split("?")[0])

          if len(working) < TARGET_COUNT:
            cands = []
            for url in SOURCES:
              try:
                raw = urllib.request.urlopen(url, timeout=8).read().decode("utf-8", "ignore")
                if "vless://" not in raw:
                  try:
                    raw = base64.b64decode(raw.strip()).decode("utf-8", "ignore")
                  except Exception:
                    pass
                cnt = 0
                for line in raw.splitlines():
                  uri = line.strip().split("#")[0]
                  if uri.startswith("vless://") and uri not in seen:
                    cands.append(uri)
                    seen.add(uri)
                    cnt += 1
                    if cnt >= 100:
                      break
              except Exception:
                pass

            with concurrent.futures.ThreadPoolExecutor(max_workers=25) as ex:
              for res in ex.map(test_vless_with_xray, cands):
                if res and len(working) < TARGET_COUNT:
                  uri, cc = res
                  if country_counts.get(cc, 0) < 2:
                    countryCount = country_counts.get(cc, 0) + 1
                    country_counts[cc] = countryCount
                    working.append(f"{uri}#{cc}")
                    print("NEW:", cc, uri.split("@")[1].split("?")[0])

          with open("verified_vless.txt", "w", encoding="utf-8") as f:
            f.write("\n".join(working) + "\n")
          print("Total verified 100% working:", len(working))
          EOF

      - name: Commit verified_vless.txt
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add verified_vless.txt
          git commit -m "Update verified VLESS nodes" || true
          git push
